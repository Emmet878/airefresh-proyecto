<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: head('Algo salió mal')}"></head>
<body class="bg-light">
    <main class="container py-5 text-center" style="max-width:600px;">
        <p class="display-4 text-primary mb-0" th:text="${status != null ? status : 'Error'}">Error</p>
        <h1 class="h3" th:text="${titulo != null ? titulo : 'Ocurrió un problema'}">Ocurrió un problema</h1>
        <p class="text-muted" th:text="${mensaje != null ? mensaje : 'Inténtalo de nuevo en unos minutos.'}"></p>
        <a class="btn btn-primary" th:href="@{/}">Volver al inicio</a>
        <a class="btn btn-outline-secondary" th:href="@{/productos}">Ver productos</a>
    </main>
</body>
</html>
