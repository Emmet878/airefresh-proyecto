<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
  Piezas comunes que las demás plantillas insertan con th:replace.
    head(titulo)   <head> de las páginas con Bootstrap (carrito, checkout,
                   pedidos, admin, equipos, errores...).
  La portada y el catálogo usan su propio CSS (style.css / producto.css).
-->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Airefresh'">Airefresh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body></body>
</html>
