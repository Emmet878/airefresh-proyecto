<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo | Airefresh</title>
    <link rel="stylesheet" th:href="@{/css/producto/producto.css}">
</head>

<body>

    <header class="navbar">
        <div class="header-container">
            <a class="brand" th:href="@{/}" aria-label="Airefresh, inicio">
              <img th:src="@{/img/logo.png}" alt="" class="brand-logo">
              <span>AIRE<span>FRESH</span></span> 
            </a>

            <nav class="nav-links">
                <a th:href="@{/}" class="nav-item">Inicio</a>
                <a th:href="@{/productos}" class="nav-item">Productos</a>
                <a href="" class="nav-item">Calcular BTU</a> <!--Crear-->
            </nav>

            <div class="top-actions">
                <a th:href="@{/carrito}">Carrito</a>
                <a th:href="@{/login}" class="btn-login" sec:authorize="!isAuthenticated()">Iniciar sesión</a>
                <a th:href="@{/pedidos}" sec:authorize="isAuthenticated()">Mis pedidos</a>
                <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">Administración</a>
            </div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL QUE DIVIDE EN DOS COLUMNAS (SIDEBAR + MAIN-CONTENT) -->
    <main class="container">

        <!-- 1. BARRA LATERAL DE FILTROS (IZQUIERDA) -->
        <aside class="sidebar">
            <form th:action="@{/productos}" method="get">
                
                <div class="filter-group">
                    <div class="filter-title">Capacidad BTU <span>-</span></div>
                    <div class="filter-options" style="display: flex; flex-direction: column; gap: 6px;">
                        <label><input type="radio" name="btu" value="18000" th:checked="${param.btu != null and param.btu[0] == '18000'}"> 18000 BTU</label>
                        <label><input type="radio" name="btu" value="12000" th:checked="${param.btu != null and param.btu[0] == '12000'}"> 12000 BTU</label>
                        <label><input type="radio" name="btu" value="24000" th:checked="${param.btu != null and param.btu[0] == '24000'}"> 24000 BTU</label>
                        <label><input type="radio" name="btu" value="36000" th:checked="${param.btu != null and param.btu[0] == '36000'}"> 36000 BTU</label>
                        <label><input type="radio" name="btu" value="9000" th:checked="${param.btu != null and param.btu[0] == '9000'}"> 9000 BTU</label>
                    </div>
                </div>

                <div class="filter-group">
                    <div class="filter-title">Tipo de Aire <span>-</span></div>
                    <div class="filter-options" style="display: flex; flex-direction: column; gap: 6px;">
                        <label><input type="radio" name="tipo" value="Mini Split Inverter" th:checked="${param.tipo != null and param.tipo[0] == 'Mini Split Inverter'}"> Mini Split Inverter</label>
                        <label><input type="radio" name="tipo" value="Mini Split ON/OFF" th:checked="${param.tipo != null and param.tipo[0] == 'Mini Split ON/OFF'}"> Mini Split ON/OFF</label>
                    </div>
                </div>

                <div class="filter-group">
                    <div class="filter-title">Marca <span>-</span></div>
                    <div class="filter-options">
                        <input name="marca" placeholder="Marca (ej. LG)" th:value="${param.marca != null ? param.marca[0] : ''}" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    </div>
                </div>

                <div class="filter-group">
                    <div class="filter-title">Precio del producto <span>-</span></div>
                    <div class="filter-options" style="display: flex; flex-direction: column; gap: 8px;">
                        <input name="min" type="number" min="0" step="1000" placeholder="Precio mínimo" th:value="${param.min != null ? param.min[0] : ''}" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                        <input name="max" type="number" min="0" step="1000" placeholder="Precio máximo" th:value="${param.max != null ? param.max[0] : ''}" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    </div>
                </div>

                <button class="btn-cart" type="submit" style="margin-bottom: 8px;">Filtrar</button>
                <a th:href="@{/productos}" class="btn-reset" style="display:block; text-align:center; text-decoration:none;">Limpiar</a>

            </form>
        </aside>

        <!-- 2. CONTENIDO PRINCIPAL DE PRODUCTOS (DERECHA) -->
        <section class="main-content">

            <div class="catalog-toolbar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1>Catálogo de aires acondicionados</h1>
                <span th:text="${#lists.size(equipos) + ' productos'}"></span>
            </div>

            <div class="products-grid">

                <article class="product-card" th:each="equipo : ${equipos}">

                    <div style="width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                        <img th:if="${equipo.foto != null and !#strings.isEmpty(equipo.foto)}"
                             th:src="@{'/equipos/fotos/' + ${equipo.foto}}"
                             th:alt="${equipo.marca + ' ' + equipo.modelo}"
                             style="max-width: 100%; max-height: 100%; object-fit: contain;">

                        <img th:unless="${equipo.foto != null and !#strings.isEmpty(equipo.foto)}"
                             th:src="@{/img/logo.png}"
                             alt="Imagen no disponible"
                             style="max-width: 60%; max-height: 60%; object-fit: contain;">
                    </div>

                    <h3 th:text="${equipo.marca + ' ' + equipo.modelo}"></h3>

                    <p th:text="${equipo.btu + ' BTU · ' + (equipo.tipo == null ? 'Aire acondicionado' : equipo.tipo)}"></p>

                    <p>
                        <strong th:text="${'$' + #numbers.formatDecimal(equipo.precio, 1, 'POINT', 2, 'COMMA')}"></strong>
                    </p>

                    <p th:if="${equipo.existencias > 0}"
                       th:text="${'Disponibles: ' + equipo.existencias}">
                    </p>

                    <p th:if="${equipo.existencias == 0}">
                        Agotado
                    </p>

                    <form th:if="${equipo.existencias > 0}"
                          th:action="@{'/carrito/agregar/' + ${equipo.id}}"
                          method="post">

                        <input type="hidden" name="cantidad" value="1">

                        <button class="btn-cart" type="submit">
                            Añadir al carrito
                        </button>
                    </form>

                </article>

                <p class="empty" th:if="${#lists.isEmpty(equipos)}" style="grid-column: 1 / -1; text-align: center; padding: 30px;">
                    No hay productos que coincidan con tu búsqueda.
                </p>

            </div>

        </section>

    </main>

</body>
</html>
