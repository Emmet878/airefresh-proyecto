<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: head('Carrito')}"></head>
<body class="bg-light">
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Tu carrito</h1>
            <a th:href="@{/productos}">Seguir comprando</a>
        </div>
        
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <div class="alert alert-info" th:if="${#lists.isEmpty(lineas)}">
            Tu carrito está vacío.
        </div>
        
        <div class="table-responsive" th:unless="${#lists.isEmpty(lineas)}">
            <table class="table bg-white align-middle">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="linea : ${lineas}">
                        <td th:text="${linea.equipo.marca + ' ' + linea.equipo.modelo}"></td>
                        <td th:text="${'$' + #numbers.formatDecimal(linea.equipo.precio, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td>
                            <form class="d-flex gap-2" th:action="@{'/carrito/actualizar/' + ${linea.equipo.id}}" method="post">
                                <input class="form-control" style="max-width:90px" type="number" name="cantidad" min="0" max="20" th:value="${linea.cantidad}">
                                <button class="btn btn-outline-primary">Actualizar</button>
                            </form>
                        </td>
                        <td th:text="${'$' + #numbers.formatDecimal(linea.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td>
                            <form th:action="@{'/carrito/quitar/' + ${linea.equipo.id}}" method="post">
                                <button class="btn btn-outline-danger">Quitar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div class="text-end mt-4">
                <h3 th:text="${'Total: $' + #numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA')}"></h3>
                <a class="btn btn-success btn-lg mt-2" th:href="@{/checkout}">Continuar al pedido</a>
            </div>
        </div>
    </main>
</body>
</html>
